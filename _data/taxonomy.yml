- id: foundations
  name: 기반 지식
  number: "01"
  description: 모델과 시스템을 제대로 이해하기 위한 수학적·통계적 토대
  children:
    - name: 수리적 사고
      topics: 미적분 · 선형대수 · 미분방정식 · 금융공학
    - name: 통계적 추론
      topics: 수리통계 · 회귀 · 표본조사 · 범주형 · 비모수
    - name: 시간과 인과
      topics: 시계열 · 인과추론 · 생존분석 · 종단 데이터

- id: modeling
  name: 학습과 모델링
  number: "02"
  description: 데이터로부터 패턴을 학습하고 성능을 검증하는 방법
  children:
    - name: 머신러닝
      topics: 예측 · 분류 · 비지도학습 · 피처 엔지니어링
    - name: 딥러닝
      topics: 신경망 · Vision · LLM · 표현 학습
    - name: 실험과 평가
      topics: 기준선 · 메트릭 · 오류 분석 · 재현성

- id: intelligent-systems
  name: 지능형 시스템
  number: "03"
  description: 생성 모델이 지식을 찾고 도구를 사용하며 행동하는 시스템
  children:
    - name: 생성형 AI
      topics: LLM · 멀티모달 · 프롬프트 · 파인튜닝
    - name: 지식과 검색
      topics: 임베딩 · 벡터 검색 · RAG · 평가
    - name: 에이전트
      topics: 도구 사용 · 메모리 · 워크플로 · 멀티 에이전트

- id: engineering
  name: 개발과 제품화
  number: "04"
  description: 아이디어를 빠르게 구현하고 신뢰할 수 있는 제품으로 만드는 과정
  children:
    - name: AI 엔지니어링
      topics: 데이터 파이프라인 · 서빙 · 관측성 · MLOps
    - name: 프로토타이핑
      topics: 바이브코딩 · Claude · Codex · Cursor · MVP
    - name: 운영과 개선
      topics: 테스트 · 자동화 · 비용 · 성능 최적화

- id: industrial-ai
  name: 산업 AI
  number: "05"
  description: 제조 현장의 데이터와 제약 조건을 반영한 문제 해결
  children:
    - name: 통신
      topics: 고객 이탈 · 수요 예측 · 네트워크 분석
    - name: 반도체
      topics: 수율 · 이상 탐지 · FDC · 설비 데이터
    - name: 제조
      topics: 품질 검사 · 예지보전 · 공정 최적화

- id: projects-growth
  name: 프로젝트와 성장
  number: "06"
  description: 실제로 만든 것과 일하며 배운 것을 증거 중심으로 정리한 기록
  children:
    - name: 대학원·개인 연구
      topics: 대학원 프로젝트 · 개인 프로젝트 · 재현 연구
    - name: 산업 프로젝트
      topics: 통신 · 반도체 · 제조 · 비즈니스 임팩트
    - name: 논문 읽기
      topics: ML/DL · Agent · 바이브코딩 · 산업 응용
    - name: 커리어 노트
      topics: 포트폴리오 · 이직 준비 · 역량 지도 · 학습 회고

