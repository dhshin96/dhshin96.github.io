<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'ko' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f5f0">
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta name="twitter:card" content="summary">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    {% if page.math %}
    <script>
      window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    {% endif %}
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="홈">
          <span class="brand-mark">DS</span>
          <span>DH Shin <em>Tech Notes</em></span>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">메뉴</button>
        <nav id="site-nav" class="site-nav" aria-label="주요 메뉴">
          <a href="{{ '/categories/' | relative_url }}">카테고리</a>
          <a href="{{ '/projects/' | relative_url }}">프로젝트</a>
          <a href="{{ '/archive/' | relative_url }}">아카이브</a>
          <a href="{{ '/about/' | relative_url }}">소개</a>
          <a class="github-link" href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">GitHub ↗</a>
        </nav>
      </div>
    </header>

    <main>{{ content }}</main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div>
          <strong>{{ site.title }}</strong>
          <p>배운 것을 설명하고, 만든 것을 기록합니다.</p>
        </div>
        <p>© {{ 'now' | date: '%Y' }} DH Shin · Built with GitHub Pages</p>
      </div>
    </footer>
    <script>
      const toggle = document.querySelector('.nav-toggle');
      const nav = document.querySelector('.site-nav');
      toggle?.addEventListener('click', () => {
        const open = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', String(!open));
        nav.classList.toggle('is-open');
      });
    </script>
  </body>
</html>
