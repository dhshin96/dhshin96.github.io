<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 에이전트 계획 실행 재계획 흐름</title>
  <desc id="desc">목표 D를 향해 A에서 B와 D로 가는 첫 계획을 만들고, B에서 D로 가는 길이 막힌 관찰을 계획기에 돌려보내 B에서 C와 D로 우회하는 계획으로 수정하는 흐름</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#15803d"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <text x="60" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="34" font-weight="700" fill="#0f172a">계획과 실행: 관찰로 남은 경로를 고친다</text>
  <text x="60" y="106" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" fill="#475569">처음 계획을 고집하지 않고, 현재 상태와 실패 정보를 이용해 재계획한다.</text>

  <rect x="60" y="160" width="285" height="180" rx="24" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="95" y="205" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">계획기</text>
  <text x="95" y="246" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#334155">현재 상태 A · 목표 D</text>
  <rect x="95" y="270" width="215" height="46" rx="12" fill="#ffffff"/>
  <text x="202" y="300" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#1d4ed8">A → B → D</text>

  <path d="M365 250 H445" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="382" y="225" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#2563eb">첫 행동</text>

  <rect x="465" y="160" width="285" height="180" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="500" y="205" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#334155">실행기</text>
  <text x="500" y="246" font-family="Consolas, monospace" font-size="18" fill="#334155">A → B</text>
  <rect x="500" y="270" width="215" height="46" rx="12" fill="#dcfce7"/>
  <text x="607" y="300" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#166534">성공 · 상태 B</text>

  <path d="M770 250 H850" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="786" y="225" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#2563eb">다음 행동</text>

  <rect x="870" y="160" width="270" height="180" rx="24" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="905" y="205" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#b91c1c">관찰</text>
  <text x="905" y="246" font-family="Consolas, monospace" font-size="18" fill="#7f1d1d">B → D</text>
  <rect x="905" y="270" width="200" height="46" rx="12" fill="#ffffff"/>
  <text x="1005" y="300" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#dc2626">차단 · 상태 B 유지</text>

  <path d="M1005 360 V425 H205 V370" fill="none" stroke="#dc2626" stroke-width="5" marker-end="url(#arrow-red)"/>
  <text x="530" y="413" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#b91c1c">실패 정보 (B, D)를 계획기에 반영</text>

  <rect x="60" y="455" width="430" height="180" rx="24" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="95" y="500" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#c2410c">재계획</text>
  <text x="95" y="540" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#7c2d12">현재 상태 B · 차단 간선 제외</text>
  <rect x="95" y="565" width="360" height="46" rx="12" fill="#ffffff"/>
  <text x="275" y="595" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#c2410c">B → C → D</text>

  <path d="M510 545 H620" stroke="#15803d" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="533" y="520" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#15803d">다시 실행</text>

  <rect x="640" y="455" width="500" height="180" rx="24" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text x="675" y="500" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#15803d">완료</text>
  <text x="675" y="542" font-family="Consolas, monospace" font-size="18" fill="#166534">B → C  성공</text>
  <text x="675" y="576" font-family="Consolas, monospace" font-size="18" fill="#166534">C → D  성공</text>
  <rect x="930" y="505" width="165" height="82" rx="16" fill="#166534"/>
  <text x="1012" y="540" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#ffffff">최종 상태 D</text>
  <text x="1012" y="567" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#dcfce7">재계획 1회</text>
</svg>
