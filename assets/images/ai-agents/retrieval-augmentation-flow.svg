<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 에이전트 검색 결합 흐름</title>
  <desc id="desc">환불 기간 질문을 문서 조각 세 개와 비교해 점수 임계값을 넘은 환불 정책 조각 하나만 선택하고, 질문과 근거를 답변 입력으로 결합하는 흐름</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <text x="60" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="34" font-weight="700" fill="#0f172a">검색 결합: 근거를 고른 뒤 답변 입력에 붙인다</text>
  <text x="60" y="106" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" fill="#475569">후보 전체가 아니라 점수 기준을 통과한 문서 조각만 컨텍스트가 된다.</text>

  <rect x="60" y="180" width="235" height="145" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="95" y="225" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#334155">질문</text>
  <text x="95" y="272" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="700" fill="#1d4ed8">환불 기간</text>
  <text x="95" y="303" font-family="Consolas, monospace" font-size="15" fill="#475569">{환불, 기간}</text>

  <path d="M315 252 H390" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="324" y="229" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#2563eb">비교</text>

  <rect x="410" y="145" width="360" height="360" rx="24" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="445" y="190" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">문서 조각 순위</text>
  <rect x="445" y="220" width="290" height="70" rx="14" fill="#dcfce7"/>
  <text x="465" y="250" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#166534">refund-policy</text>
  <text x="465" y="275" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#166534">0.707 · 기준 통과</text>
  <rect x="445" y="310" width="290" height="70" rx="14" fill="#f1f5f9"/>
  <text x="465" y="340" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#475569">refund-method</text>
  <text x="465" y="365" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#475569">0.408 · 제외</text>
  <rect x="445" y="400" width="290" height="70" rx="14" fill="#f1f5f9"/>
  <text x="465" y="430" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#475569">shipping</text>
  <text x="465" y="455" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#475569">0.000 · 제외</text>

  <path d="M790 325 H865" stroke="#15803d" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="800" y="302" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#15803d">선택</text>

  <rect x="885" y="180" width="255" height="290" rx="24" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text x="920" y="225" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#15803d">답변 입력</text>
  <rect x="920" y="255" width="185" height="58" rx="12" fill="#ffffff"/>
  <text x="940" y="290" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#334155">질문: 환불 기간</text>
  <rect x="920" y="330" width="185" height="100" rx="12" fill="#ffffff"/>
  <text x="940" y="360" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#166534">근거 1개</text>
  <text x="940" y="390" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#166534">결제일로부터</text>
  <text x="940" y="416" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#166534">7일</text>

  <path d="M1010 490 V565" stroke="#15803d" stroke-width="5" marker-end="url(#arrow-green)"/>
  <rect x="785" y="585" width="355" height="72" rx="20" fill="#0f172a"/>
  <text x="962" y="615" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">근거 기반 모의 답변</text>
  <text x="962" y="642" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#cbd5e1">문서 ID로 출처를 추적한다</text>

  <rect x="60" y="565" width="650" height="92" rx="20" fill="#eff6ff"/>
  <text x="90" y="601" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">선택 규칙</text>
  <text x="90" y="634" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#1e3a8a">유사도 0.5 이상 · 기준 미달이면 근거 없음으로 처리</text>
</svg>
