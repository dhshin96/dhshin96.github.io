<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 에이전트 구조화 출력 검증 흐름</title>
  <desc id="desc">자유로운 모델 출력이 JSON 객체가 된 뒤 스키마 검증기를 거쳐 정상 객체는 실행 단계로 전달되고 필드 누락, 잘못된 자료형, 추가 필드는 오류로 거절되는 흐름</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#15803d"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <text x="60" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="34" font-weight="700" fill="#0f172a">구조화 출력: 스키마를 통과한 객체만 사용한다</text>
  <text x="60" y="106" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" fill="#475569">정상 1건은 통과하고 자료형 오류·누락·추가 필드 3건은 실행 전에 멈춘다.</text>

  <rect x="60" y="165" width="285" height="390" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="90" y="210" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#334155">모델의 후보 출력</text>
  <text x="90" y="255" font-family="Consolas, monospace" font-size="17" fill="#1e3a8a">{</text>
  <text x="110" y="292" font-family="Consolas, monospace" font-size="17" fill="#1e3a8a">"action": "search_docs",</text>
  <text x="110" y="329" font-family="Consolas, monospace" font-size="17" fill="#1e3a8a">"query": "구조화 출력",</text>
  <text x="110" y="366" font-family="Consolas, monospace" font-size="17" fill="#1e3a8a">"limit": 3</text>
  <text x="90" y="403" font-family="Consolas, monospace" font-size="17" fill="#1e3a8a">}</text>
  <rect x="90" y="455" width="225" height="62" rx="14" fill="#f1f5f9"/>
  <text x="112" y="482" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#475569">자유 문장이 아니라</text>
  <text x="112" y="505" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#475569">키와 값이 있는 JSON 객체</text>

  <path d="M365 360 H445" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <rect x="465" y="165" width="290" height="390" rx="24" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="500" y="210" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">JSON 스키마 검증</text>
  <rect x="500" y="245" width="220" height="66" rx="14" fill="#ffffff"/>
  <text x="520" y="273" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">① 필드 집합</text>
  <text x="520" y="297" font-family="Consolas, monospace" font-size="15" fill="#475569">action, query, limit</text>
  <rect x="500" y="327" width="220" height="66" rx="14" fill="#ffffff"/>
  <text x="520" y="355" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">② 자료형</text>
  <text x="520" y="379" font-family="Consolas, monospace" font-size="15" fill="#475569">str, str, int</text>
  <rect x="500" y="409" width="220" height="95" rx="14" fill="#ffffff"/>
  <text x="520" y="437" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">③ 값의 제약</text>
  <text x="520" y="463" font-family="Consolas, monospace" font-size="15" fill="#475569">action ∈ allowed</text>
  <text x="520" y="488" font-family="Consolas, monospace" font-size="15" fill="#475569">1 ≤ limit ≤ 5</text>

  <path d="M775 265 H855" stroke="#15803d" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="790" y="245" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#15803d">통과</text>
  <rect x="875" y="165" width="265" height="190" rx="24" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text x="905" y="210" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#15803d">검증된 객체</text>
  <text x="905" y="252" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#14532d">후속 코드가 필드를</text>
  <text x="905" y="280" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#14532d">추측 없이 사용</text>
  <rect x="905" y="305" width="200" height="28" rx="14" fill="#dcfce7"/>
  <text x="942" y="325" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#166534">accepted = 1</text>

  <path d="M775 455 H855" stroke="#dc2626" stroke-width="5" marker-end="url(#arrow-red)"/>
  <text x="790" y="435" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#dc2626">실패</text>
  <rect x="875" y="385" width="265" height="210" rx="24" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="905" y="430" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#b91c1c">거절하고 오류 기록</text>
  <text x="905" y="470" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#7f1d1d">• limit가 문자열</text>
  <text x="905" y="505" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#7f1d1d">• query 누락</text>
  <text x="905" y="540" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#7f1d1d">• debug 추가</text>
  <text x="905" y="575" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#991b1b">rejected = 3</text>

  <rect x="235" y="625" width="730" height="52" rx="18" fill="#0f172a"/>
  <text x="600" y="658" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#f8fafc">스키마 통과는 형식 보장이다. 내용의 사실성·권한·안전성은 별도로 확인한다.</text>
</svg>
