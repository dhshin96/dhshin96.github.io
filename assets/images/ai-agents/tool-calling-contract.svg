<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">AI 에이전트의 도구 호출과 실행 경계</title>
  <desc id="desc">사용자 요청이 모델의 JSON 호출 제안으로 바뀌고 애플리케이션이 스키마를 검증한 뒤 multiply 함수를 실행하여 53700 결과를 모델에 돌려주는 흐름</desc>
  <rect width="1200" height="680" rx="28" fill="#f8fafc"/>
  <text x="70" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="34" font-weight="700" fill="#0f172a">도구 호출: 제안과 실행 사이의 검증 경계</text>
  <text x="70" y="116" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" fill="#475569">모델은 호출서를 만들고, 애플리케이션은 허용된 코드만 실행한다.</text>

  <rect x="60" y="180" width="225" height="170" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="85" y="220" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#475569">1. 사용자 요청</text>
  <text x="85" y="270" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#0f172a">17,900원 × 3개</text>
  <text x="85" y="305" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" fill="#334155">총액을 계산해 줘</text>

  <path d="M300 265 H350" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <path d="M340 252 L357 265 L340 278" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="370" y="160" width="300" height="210" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="400" y="205" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">2. 모델의 호출 제안</text>
  <text x="400" y="250" font-family="Consolas, monospace" font-size="18" fill="#1e3a8a">name: multiply</text>
  <text x="400" y="285" font-family="Consolas, monospace" font-size="18" fill="#1e3a8a">a: 17900</text>
  <text x="400" y="320" font-family="Consolas, monospace" font-size="18" fill="#1e3a8a">b: 3</text>

  <path d="M685 265 H735" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <path d="M725 252 L742 265 L725 278" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="755" y="160" width="385" height="210" rx="22" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text x="785" y="205" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#15803d">3. 애플리케이션 검증·실행</text>
  <text x="785" y="250" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" fill="#14532d">✓ 등록된 도구인가?</text>
  <text x="785" y="285" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" fill="#14532d">✓ a, b가 정수인가?</text>
  <text x="785" y="320" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#14532d">multiply(17900, 3)</text>

  <path d="M948 385 V430" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
  <path d="M935 420 L948 437 L961 420" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="370" y="450" width="770" height="145" rx="22" fill="#0f172a"/>
  <text x="400" y="495" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#93c5fd">4. 도구 결과를 모델에 반환</text>
  <text x="400" y="545" font-family="Consolas, monospace" font-size="25" font-weight="700" fill="#f8fafc">{&quot;ok&quot;: true, &quot;value&quot;: 53700}</text>
  <text x="400" y="578" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#cbd5e1">결과를 받은 모델이 사용자에게 최종 문장을 만든다.</text>

  <rect x="60" y="450" width="270" height="145" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="85" y="495" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#c2410c">검증 실패 시</text>
  <text x="85" y="535" font-family="Consolas, monospace" font-size="17" fill="#9a3412">coupon: 1000</text>
  <text x="85" y="570" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#9a3412">함수를 실행하지 않고 거절</text>
</svg>
