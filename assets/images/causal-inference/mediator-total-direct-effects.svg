<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">매개 DAG와 총효과의 분해</title>
  <desc id="desc">새 학습법 A에서 시험 점수 Y로 가는 직접 경로 4점과 연습 시간 M을 거치는 간접 경로 6점이 총효과 10점을 이루는 그림이다.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#176b52"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e9783d"/>
    </marker>
  </defs>
  <rect width="900" height="480" rx="24" fill="#fffefa"/>
  <g font-family="Arial, 'Noto Sans KR', sans-serif">
    <text x="450" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#1b211d">총효과는 두 인과 경로를 모두 포함한다</text>

    <path d="M232 192 C338 88 562 88 668 192" fill="none" stroke="#e9783d" stroke-width="6" marker-end="url(#arrow-orange)"/>
    <path d="M245 240 L393 240" fill="none" stroke="#176b52" stroke-width="6" marker-end="url(#arrow-green)"/>
    <path d="M507 240 L655 240" fill="none" stroke="#176b52" stroke-width="6" marker-end="url(#arrow-green)"/>

    <circle cx="190" cy="240" r="58" fill="#d9eadf" stroke="#176b52" stroke-width="4"/>
    <circle cx="450" cy="240" r="58" fill="#eef0eb" stroke="#68706a" stroke-width="4"/>
    <circle cx="710" cy="240" r="58" fill="#fce5d8" stroke="#e9783d" stroke-width="4"/>

    <text x="190" y="232" text-anchor="middle" font-size="30" font-weight="700" fill="#176b52">A</text>
    <text x="190" y="260" text-anchor="middle" font-size="15" fill="#3e4640">새 학습법</text>
    <text x="450" y="232" text-anchor="middle" font-size="30" font-weight="700" fill="#3e4640">M</text>
    <text x="450" y="260" text-anchor="middle" font-size="15" fill="#3e4640">연습 시간</text>
    <text x="710" y="232" text-anchor="middle" font-size="30" font-weight="700" fill="#b74f1e">Y</text>
    <text x="710" y="260" text-anchor="middle" font-size="15" fill="#3e4640">시험 점수</text>

    <rect x="296" y="118" width="308" height="44" rx="22" fill="#fce5d8"/>
    <text x="450" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#b74f1e">직접 경로 A → Y: 4점</text>
    <rect x="292" y="313" width="316" height="44" rx="22" fill="#d9eadf"/>
    <text x="450" y="341" text-anchor="middle" font-size="17" font-weight="700" fill="#176b52">간접 경로 A → M → Y: 6점</text>

    <line x1="258" y1="404" x2="642" y2="404" stroke="#d9ddd7" stroke-width="2"/>
    <text x="450" y="428" text-anchor="middle" font-size="19" font-weight="700" fill="#1b211d">총효과 10점 = 직접효과 4점 + 간접효과 6점</text>
  </g>
</svg>
