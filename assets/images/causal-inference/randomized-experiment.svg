<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">무작위실험의 기본 구조</title>
  <desc id="desc">참가자를 무작위로 처리군과 대조군에 배정한 뒤 각 집단의 평균 결과를 비교한다.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b52"/></marker></defs>
  <rect width="920" height="500" rx="28" fill="#fffefa"/>
  <text x="460" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1b211d">무작위실험: 비교 가능한 두 집단 만들기</text>
  <rect x="50" y="176" width="190" height="126" rx="22" fill="#1b211d"/>
  <text x="145" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">참가자</text>
  <text x="145" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#dcded7">서로 다른 특성 보유</text>
  <path d="M242 239H307" fill="none" stroke="#176b52" stroke-width="5" marker-end="url(#arrow)"/>
  <circle cx="382" cy="239" r="70" fill="#d9eadf" stroke="#176b52" stroke-width="3"/>
  <text x="382" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#176b52">무작위배정</text>
  <text x="382" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#3e4640">동전 던지기</text>
  <path d="M448 214C498 182 511 155 555 150" fill="none" stroke="#176b52" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M448 264C498 296 511 323 555 328" fill="none" stroke="#176b52" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="575" y="95" width="175" height="110" rx="20" fill="#176b52"/>
  <text x="662" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">처리군 T=1</text>
  <text x="662" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#d9eadf">평균 결과 계산</text>
  <rect x="575" y="273" width="175" height="110" rx="20" fill="#eeece6" stroke="#b7bcb8"/>
  <text x="662" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#3e4640">대조군 T=0</text>
  <text x="662" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#68706a">평균 결과 계산</text>
  <path d="M752 150H805V183" fill="none" stroke="#e9783d" stroke-width="4"/>
  <path d="M752 328H805V295" fill="none" stroke="#e9783d" stroke-width="4"/>
  <circle cx="805" cy="239" r="56" fill="#e9783d"/>
  <text x="805" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">평균의</text>
  <text x="805" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">차이</text>
  <text x="460" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#3e4640">무작위배정 → 처리 전 특성이 평균적으로 비슷함 → 공정한 비교</text>
</svg>
