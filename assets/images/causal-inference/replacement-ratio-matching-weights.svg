<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">복원 1대2 매칭의 반복 대조군 가중치 계산</title>
  <desc id="desc">처리 대상 T1, T2, T3가 각각 대조군 두 명과 연결되고 C1이 세 세트에서 재사용되어 가중치 1.5를 받는다. 세트 차이 8, 6, 14의 평균 ATT는 9.33이다.</desc>
  <rect width="960" height="560" rx="28" fill="#f8fafc"/>
  <text x="480" y="52" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#0f172a">복원 1:2 매칭: 반복 횟수를 가중치로 남기기</text>

  <rect x="44" y="86" width="468" height="394" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="278" y="122" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#334155">세트마다 대조군 기여는 1/2</text>

  <g font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" text-anchor="middle">
    <g fill="#eff6ff" stroke="#93c5fd" stroke-width="2">
      <rect x="76" y="154" width="104" height="62" rx="14"/>
      <rect x="76" y="254" width="104" height="62" rx="14"/>
      <rect x="76" y="354" width="104" height="62" rx="14"/>
    </g>
    <g fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2">
      <rect x="330" y="138" width="132" height="54" rx="13"/>
      <rect x="330" y="204" width="132" height="54" rx="13"/>
      <rect x="330" y="270" width="132" height="54" rx="13"/>
      <rect x="330" y="336" width="132" height="54" rx="13"/>
      <rect x="330" y="402" width="132" height="54" rx="13"/>
    </g>
    <g fill="#1e3a8a" font-weight="700">
      <text x="128" y="180">T1 = 80</text><text x="128" y="202">차이 8</text>
      <text x="128" y="280">T2 = 75</text><text x="128" y="302">차이 6</text>
      <text x="128" y="380">T3 = 90</text><text x="128" y="402">차이 14</text>
    </g>
    <g fill="#065f46">
      <text x="396" y="171" font-weight="700">C1 = 70</text>
      <text x="396" y="237">C2 = 74</text>
      <text x="396" y="303">C3 = 68</text>
      <text x="396" y="369">C4 = 82</text>
      <text x="396" y="435" font-weight="700" fill="#7c3aed">C1 가중치 = 1.5</text>
    </g>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M180 174 C238 174 270 160 330 160" stroke="#2563eb" stroke-width="4"/>
    <path d="M180 190 C238 190 270 220 330 226" stroke="#2563eb" stroke-width="4"/>
    <path d="M180 274 C238 274 270 178 330 174" stroke="#0ea5e9" stroke-width="4"/>
    <path d="M180 290 C238 290 270 292 330 292" stroke="#0ea5e9" stroke-width="4"/>
    <path d="M180 374 C238 374 270 192 330 186" stroke="#8b5cf6" stroke-width="4"/>
    <path d="M180 390 C238 390 270 358 330 358" stroke="#8b5cf6" stroke-width="4"/>
  </g>
  <g font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#475569">
    <text x="242" y="151">0.5</text><text x="244" y="221">0.5</text>
    <text x="244" y="250">0.5</text><text x="244" y="310">0.5</text>
    <text x="244" y="339">0.5</text><text x="244" y="397">0.5</text>
  </g>

  <path d="M530 280 H570" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M558 268 L574 280 L558 292" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="594" y="106" width="322" height="148" rx="22" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="755" y="148" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#3730a3">반복 대조군 가중치</text>
  <text x="755" y="191" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="23" font-weight="700" fill="#312e81">C1: 0.5 × 3 = 1.5</text>
  <text x="755" y="224" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#475569">C2·C3·C4는 각각 0.5</text>

  <rect x="594" y="286" width="322" height="168" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="755" y="328" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#9a3412">효과와 정보량</text>
  <text x="755" y="371" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="24" font-weight="700" fill="#7c2d12">ATT = 9.33점</text>
  <text x="755" y="405" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#7c2d12">대조군 ESS = 3.00</text>
  <text x="755" y="432" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#475569">고유 대조군 4명보다 작은 유효표본</text>

  <rect x="178" y="504" width="604" height="34" rx="17" fill="#0f172a"/>
  <text x="480" y="527" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#ffffff">세트별 기여를 합치면 반복 사용과 1:k 구조가 모두 보인다</text>
</svg>
