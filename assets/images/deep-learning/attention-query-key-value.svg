<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" role="img" aria-labelledby="title desc">
  <title id="title">어텐션의 쿼리, 키, 값과 가중합 계산</title>
  <desc id="desc">쿼리 1, 0을 세 키와 내적하고 제곱근 2로 나눈 점수를 소프트맥스 가중치로 바꾼다. 가중치 0.5760, 0.2840, 0.1400으로 값 10, 20, 30을 더해 출력 15.6405를 만든다.</desc>
  <rect width="980" height="600" rx="22" fill="#f8fbf9"/>
  <text x="42" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#183d32">어텐션: 비교 점수를 값의 가중합으로 바꾸기</text>
  <text x="42" y="82" font-family="Arial, sans-serif" font-size="16" fill="#48665d">Attention(Q, K, V) = softmax(QKᵀ / √dₖ)V</text>

  <g font-family="Arial, sans-serif">
    <rect x="42" y="136" width="176" height="128" rx="18" fill="#edf4f8" stroke="#9eb9ca" stroke-width="2"/>
    <text x="130" y="172" text-anchor="middle" font-size="18" font-weight="700" fill="#255f8c">쿼리 Q</text>
    <text x="130" y="216" text-anchor="middle" font-size="22" font-weight="700" fill="#29485f">[1, 0]</text>
    <text x="130" y="244" text-anchor="middle" font-size="14" fill="#48665d">지금 찾을 조건</text>

    <rect x="282" y="112" width="296" height="176" rx="18" fill="#ffffff" stroke="#b9cbd8" stroke-width="2"/>
    <text x="430" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#255f8c">키 K와 스케일된 내적 점수</text>
    <text x="314" y="184" font-size="16" fill="#29485f">K₁ [ 1, 0]</text>
    <text x="520" y="184" text-anchor="end" font-size="16" font-weight="700" fill="#d46b22">0.7071</text>
    <text x="314" y="224" font-size="16" fill="#29485f">K₂ [ 0, 1]</text>
    <text x="520" y="224" text-anchor="end" font-size="16" font-weight="700" fill="#d46b22">0.0000</text>
    <text x="314" y="264" font-size="16" fill="#29485f">K₃ [−1, 0]</text>
    <text x="520" y="264" text-anchor="end" font-size="16" font-weight="700" fill="#d46b22">−0.7071</text>

    <rect x="642" y="112" width="296" height="176" rx="18" fill="#fff8ed" stroke="#e5b981" stroke-width="2"/>
    <text x="790" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#a95516">소프트맥스 가중치</text>
    <text x="686" y="184" font-size="16" fill="#6f4b2f">α₁</text>
    <rect x="726" y="166" width="166" height="22" rx="8" fill="#f3d2a8"/>
    <rect x="726" y="166" width="96" height="22" rx="8" fill="#d46b22"/>
    <text x="914" y="184" text-anchor="end" font-size="16" font-weight="700" fill="#a95516">0.5760</text>
    <text x="686" y="224" font-size="16" fill="#6f4b2f">α₂</text>
    <rect x="726" y="206" width="166" height="22" rx="8" fill="#f3d2a8"/>
    <rect x="726" y="206" width="47" height="22" rx="8" fill="#d46b22"/>
    <text x="914" y="224" text-anchor="end" font-size="16" font-weight="700" fill="#a95516">0.2840</text>
    <text x="686" y="264" font-size="16" fill="#6f4b2f">α₃</text>
    <rect x="726" y="246" width="166" height="22" rx="8" fill="#f3d2a8"/>
    <rect x="726" y="246" width="23" height="22" rx="8" fill="#d46b22"/>
    <text x="914" y="264" text-anchor="end" font-size="16" font-weight="700" fill="#a95516">0.1400</text>

    <path d="M218 200h54" stroke="#829e94" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M578 200h54" stroke="#829e94" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="92" y="352" width="796" height="106" rx="20" fill="#ffffff" stroke="#b9cbd8" stroke-width="2"/>
    <text x="490" y="384" text-anchor="middle" font-size="18" font-weight="700" fill="#255f8c">값 V를 가중치만큼 섞기</text>
    <text x="490" y="424" text-anchor="middle" font-size="19" fill="#29485f">0.5760×10 + 0.2840×20 + 0.1400×30</text>
    <path d="M490 458v32" stroke="#829e94" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="310" y="500" width="360" height="62" rx="16" fill="#bfe4d4" stroke="#5f9f84" stroke-width="2"/>
    <text x="490" y="539" text-anchor="middle" font-size="22" font-weight="700" fill="#1d674e">어텐션 출력 = 15.6405</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#829e94"/></marker>
  </defs>
</svg>
