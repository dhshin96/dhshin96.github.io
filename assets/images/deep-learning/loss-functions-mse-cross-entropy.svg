<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">평균제곱오차와 이진 교차엔트로피 계산 흐름</title>
  <desc id="desc">위쪽 회귀 패널은 세 제곱오차 0.25, 1, 0의 평균이 0.4167임을 보여 준다. 아래쪽 이진 분류 패널은 정답 확률 0.9, 0.8, 0.8에 음의 로그를 적용한 값의 평균이 0.1839임을 보여 준다.</desc>
  <rect width="980" height="500" rx="22" fill="#f8fbf9"/>
  <text x="42" y="48" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#183d32">예제별 손실을 계산하고 평균내기</text>
  <text x="42" y="82" font-family="Arial, sans-serif" font-size="16" fill="#48665d">예측 → 예제별 손실 → 평균 손실</text>

  <rect x="36" y="110" width="908" height="150" rx="18" fill="#e7f3ec" stroke="#acd4ba" stroke-width="2"/>
  <text x="58" y="144" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#183d32">회귀 · 평균제곱오차(MSE)</text>
  <rect x="58" y="164" width="240" height="68" rx="12" fill="#ffffff" stroke="#c8ded0"/>
  <text x="76" y="190" font-family="Arial, sans-serif" font-size="16" fill="#36574c">정답: 3, −1, 2</text>
  <text x="76" y="216" font-family="Arial, sans-serif" font-size="16" fill="#36574c">예측: 2.5, 0, 2</text>
  <path d="M312 198h54" stroke="#477e64" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="380" y="164" width="250" height="68" rx="12" fill="#ffffff" stroke="#c8ded0"/>
  <text x="398" y="190" font-family="Arial, sans-serif" font-size="16" fill="#36574c">제곱오차</text>
  <text x="398" y="216" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183d32">0.25, 1.00, 0.00</text>
  <path d="M644 198h54" stroke="#477e64" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="712" y="164" width="204" height="68" rx="12" fill="#d4eadb" stroke="#8fc5a4"/>
  <text x="732" y="190" font-family="Arial, sans-serif" font-size="16" fill="#36574c">평균</text>
  <text x="732" y="218" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#146749">MSE = 0.4167</text>

  <rect x="36" y="282" width="908" height="172" rx="18" fill="#edf2f7" stroke="#b9c9d8" stroke-width="2"/>
  <text x="58" y="316" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#253f57">이진 분류 · 교차엔트로피(BCE)</text>
  <rect x="58" y="338" width="240" height="86" rx="12" fill="#ffffff" stroke="#cad7e2"/>
  <text x="76" y="366" font-family="Arial, sans-serif" font-size="16" fill="#4c657c">정답: 1, 0, 1</text>
  <text x="76" y="392" font-family="Arial, sans-serif" font-size="16" fill="#4c657c">p(클래스 1): 0.9, 0.2, 0.8</text>
  <text x="76" y="416" font-family="Arial, sans-serif" font-size="14" fill="#637e99">정답 확률: 0.9, 0.8, 0.8</text>
  <path d="M312 381h54" stroke="#637e99" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="380" y="338" width="250" height="86" rx="12" fill="#ffffff" stroke="#cad7e2"/>
  <text x="398" y="366" font-family="Arial, sans-serif" font-size="16" fill="#4c657c">−log(정답 확률)</text>
  <text x="398" y="394" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#253f57">0.1054, 0.2231, 0.2231</text>
  <path d="M644 381h54" stroke="#637e99" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="712" y="338" width="204" height="86" rx="12" fill="#dce8f2" stroke="#9fb9d0"/>
  <text x="732" y="370" font-family="Arial, sans-serif" font-size="16" fill="#4c657c">평균</text>
  <text x="732" y="401" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#255f8c">BCE = 0.1839</text>

  <defs>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#477e64"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#637e99"/></marker>
  </defs>
</svg>
