<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">Transformer 인코더 블록 계산</title>
  <desc id="desc">입력에 셀프 어텐션 출력을 더해 정규화하고, 위치별 피드포워드 수정량을 더해 다시 정규화하는 두 단계 계산 흐름이다.</desc>
  <rect width="980" height="620" rx="22" fill="#f8fbf9"/>
  <text x="42" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#183d32">Transformer 인코더 블록: 두 번의 Add &amp; Norm</text>
  <text x="42" y="82" font-family="Arial, sans-serif" font-size="16" fill="#48665d">셀프 어텐션으로 토큰을 섞고, 위치별 FFN으로 각 토큰을 독립적으로 변환한다.</text>

  <g font-family="Arial, sans-serif">
    <rect x="42" y="118" width="208" height="88" rx="16" fill="#ffffff" stroke="#9eb9ca" stroke-width="2"/>
    <text x="146" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#255f8c">입력 x</text>
    <text x="146" y="181" text-anchor="middle" font-size="19" font-weight="700" fill="#183d32">[1, 2, 3]</text>

    <rect x="294" y="118" width="250" height="88" rx="16" fill="#edf4f8" stroke="#9eb9ca" stroke-width="2"/>
    <text x="419" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#255f8c">셀프 어텐션 A(x)</text>
    <text x="419" y="181" text-anchor="middle" font-size="19" font-weight="700" fill="#183d32">[0.5, -0.5, 1.0]</text>

    <circle cx="592" cy="162" r="27" fill="#bfe4d4" stroke="#82a69a" stroke-width="2"/>
    <text x="592" y="170" text-anchor="middle" font-size="25" font-weight="700" fill="#1d674e">+</text>
    <path d="M250 162h44" fill="none" stroke="#829e94" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M544 162h21" fill="none" stroke="#829e94" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M146 206v34h446v-51" fill="none" stroke="#829e94" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="662" y="112" width="276" height="100" rx="16" fill="#ffffff" stroke="#82a69a" stroke-width="2"/>
    <text x="800" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#1d674e">잔차 합 → 층 정규화</text>
    <text x="800" y="174" text-anchor="middle" font-size="16" fill="#48665d">[1.5, 1.5, 4.0]</text>
    <text x="800" y="198" text-anchor="middle" font-size="17" font-weight="700" fill="#183d32">[-0.7071, -0.7071, 1.4142]</text>

    <path d="M800 212v55" fill="none" stroke="#829e94" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="587" y="282" width="351" height="104" rx="18" fill="#fff8ed" stroke="#e5b981" stroke-width="2"/>
    <text x="762" y="316" text-anchor="middle" font-size="18" font-weight="700" fill="#a95516">위치별 FFN: 3 → 4 → 3차원</text>
    <text x="762" y="346" text-anchor="middle" font-size="16" fill="#6f4b2f">ReLU 은닉값 [0.7071, 0, 0, 0.7071]</text>
    <text x="762" y="374" text-anchor="middle" font-size="17" font-weight="700" fill="#8e4915">수정량 [0.3536, -0.3536, 0.7071]</text>

    <path d="M662 212c-114 56-170 110-170 204" fill="none" stroke="#829e94" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M762 386v30H548" fill="none" stroke="#829e94" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="516" cy="444" r="27" fill="#f3d2a8" stroke="#e5b981" stroke-width="2"/>
    <text x="516" y="452" text-anchor="middle" font-size="25" font-weight="700" fill="#8e4915">+</text>

    <rect x="205" y="410" width="260" height="68" rx="16" fill="#ffffff" stroke="#b9cbd8" stroke-width="2"/>
    <text x="335" y="438" text-anchor="middle" font-size="16" fill="#48665d">두 번째 잔차 합</text>
    <text x="335" y="465" text-anchor="middle" font-size="18" font-weight="700" fill="#183d32">[-0.3536, -1.0607, 2.1213]</text>

    <path d="M516 471v42" fill="none" stroke="#829e94" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="263" y="526" width="506" height="62" rx="18" fill="#dcefe7" stroke="#82a69a" stroke-width="2"/>
    <text x="516" y="552" text-anchor="middle" font-size="17" fill="#48665d">층 정규화 후 블록 출력</text>
    <text x="516" y="579" text-anchor="middle" font-size="21" font-weight="700" fill="#1d674e">[-0.4319, -0.9503, 1.3822]</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#829e94"/></marker>
  </defs>
</svg>
