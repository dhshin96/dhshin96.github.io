<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">토큰 ID에서 임베딩 벡터와 코사인 유사도로 이어지는 흐름</title>
  <desc id="desc">토큰화의 ID 3이 네 행짜리 임베딩 표에서 토큰화 벡터 0.8, 0.6을 선택한다. 토큰 벡터 1.0, 0.0과의 코사인 유사도는 0.8이다.</desc>
  <rect width="1200" height="640" rx="28" fill="#f8fafc"/>
  <text x="70" y="80" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="34" font-weight="700" fill="#0f172a">임베딩: ID로 행을 찾고 벡터 방향을 비교한다</text>
  <text x="70" y="120" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" fill="#475569">설명용 2차원 표에서 ID 3은 네 번째 행을 선택한다.</text>

  <rect x="70" y="178" width="190" height="250" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="100" y="222" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#475569">1. 토큰과 ID</text>
  <text x="165" y="300" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#0f172a">토큰화</text>
  <rect x="120" y="332" width="90" height="56" rx="14" fill="#dbeafe"/>
  <text x="165" y="369" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1d4ed8">ID 3</text>

  <path d="M280 303 H340" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <path d="M330 290 L347 303 L330 316" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="288" y="274" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#2563eb">행 조회</text>

  <rect x="360" y="178" width="410" height="250" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="390" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">2. 임베딩 행렬 E (4 × 2)</text>
  <g font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19">
    <text x="405" y="264" fill="#475569">0  문</text><text x="545" y="264" fill="#0f172a">[ 0.0,  1.0 ]</text>
    <text x="405" y="304" fill="#475569">1  장</text><text x="545" y="304" fill="#0f172a">[-0.8,  0.6 ]</text>
    <text x="405" y="344" fill="#475569">2  토큰</text><text x="545" y="344" fill="#0f172a">[ 1.0,  0.0 ]</text>
    <rect x="390" y="360" width="350" height="48" rx="10" fill="#bfdbfe"/>
    <text x="405" y="392" font-weight="700" fill="#1e3a8a">3  토큰화</text><text x="545" y="392" font-weight="700" fill="#1e3a8a">[ 0.8,  0.6 ]</text>
  </g>

  <path d="M790 303 H850" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <path d="M840 290 L857 303 L840 316" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="794" y="274" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#2563eb">방향 비교</text>

  <rect x="870" y="178" width="260" height="250" rx="22" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text x="900" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#15803d">3. 코사인 유사도</text>
  <text x="1000" y="284" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" text-anchor="middle" fill="#166534">토큰화 ↔ 토큰</text>
  <text x="1000" y="343" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="42" font-weight="700" text-anchor="middle" fill="#14532d">0.8</text>
  <text x="1000" y="385" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" text-anchor="middle" fill="#166534">0.8 ÷ (1 × 1)</text>

  <rect x="70" y="485" width="1060" height="95" rx="18" fill="#0f172a"/>
  <text x="100" y="525" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#93c5fd">기억할 점</text>
  <text x="100" y="558" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" fill="#f8fafc">표의 값은 설명용이다. 실제 임베딩은 학습으로 바뀌며, 조회 뒤 Transformer에서 문맥 표현으로 변한다.</text>
</svg>
