<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">프롬프트, RAG, 파인튜닝 선택 흐름</title>
  <desc id="desc">최신 외부 지식이 필요하면 RAG를 선택한다. 그렇지 않으면 프롬프트 평가 통과율을 확인한다. 목표를 통과하면 프롬프트를 유지한다. 실패했고 반복 행동과 대표 예제가 모두 준비됐으면 파인튜닝을 검토하고, 아니면 프롬프트와 데이터를 먼저 개선한다.</desc>
  <rect width="1200" height="680" rx="24" fill="#f7fafc"/>
  <text x="54" y="58" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="30" font-weight="700" fill="#17324d">파인튜닝은 마지막 후보로 검토한다</text>
  <text x="54" y="92" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#52677a">지식 문제 → 프롬프트 기준 → 행동 격차와 데이터 순서로 판정</text>

  <rect x="54" y="140" width="260" height="122" rx="20" fill="#ffffff" stroke="#9fb8d0" stroke-width="2"/>
  <text x="184" y="184" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1d4f78">최신·외부 지식이</text>
  <text x="184" y="216" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1d4f78">필요한가?</text>
  <text x="184" y="244" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#52677a">K = 1 또는 0</text>

  <path d="M314 201 H410" stroke="#476b8e" stroke-width="5" stroke-linecap="round"/>
  <path d="M394 187 L412 201 L394 215" fill="none" stroke="#476b8e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="361" y="184" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#166534">예</text>
  <rect x="432" y="144" width="226" height="114" rx="20" fill="#e8f5ee" stroke="#8cc5a5" stroke-width="2"/>
  <text x="545" y="191" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="700" fill="#166534">RAG</text>
  <text x="545" y="224" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#166534">근거를 검색해 입력</text>

  <path d="M184 262 V342" stroke="#476b8e" stroke-width="5" stroke-linecap="round"/>
  <path d="M170 326 L184 344 L198 326" fill="none" stroke="#476b8e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="205" y="310" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#9f1239">아니요</text>

  <rect x="54" y="364" width="260" height="122" rx="20" fill="#ffffff" stroke="#c9b7e8" stroke-width="2"/>
  <text x="184" y="408" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#5b3e91">프롬프트가 목표를</text>
  <text x="184" y="440" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#5b3e91">통과했는가?</text>
  <text x="184" y="468" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#52677a">예: 통과율 ≥ 80%</text>

  <path d="M314 425 H410" stroke="#476b8e" stroke-width="5" stroke-linecap="round"/>
  <path d="M394 411 L412 425 L394 439" fill="none" stroke="#476b8e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="361" y="408" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#166534">예</text>
  <rect x="432" y="368" width="226" height="114" rx="20" fill="#f3efff" stroke="#c9b7e8" stroke-width="2"/>
  <text x="545" y="415" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="23" font-weight="700" fill="#5b3e91">프롬프트 유지</text>
  <text x="545" y="448" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#5b3e91">추가 학습 불필요</text>

  <path d="M184 486 V566 H702" fill="none" stroke="#476b8e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M686 552 L704 566 L686 580" fill="none" stroke="#476b8e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="205" y="534" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#9f1239">아니요</text>

  <rect x="724" y="350" width="422" height="150" rx="20" fill="#ffffff" stroke="#e2b36e" stroke-width="2"/>
  <text x="935" y="392" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#865d12">반복 행동 + 대표 예제가 있는가?</text>
  <text x="935" y="426" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#52677a">B = 1 · G = 1 · D = 1</text>
  <text x="935" y="461" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#52677a">평가로 격차 확인 · 검토된 데이터 준비</text>

  <path d="M935 500 V546" stroke="#476b8e" stroke-width="5" stroke-linecap="round"/>
  <path d="M921 530 L935 548 L949 530" fill="none" stroke="#476b8e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="724" y="566" width="200" height="74" rx="18" fill="#fff7df" stroke="#e2b36e" stroke-width="2"/>
  <text x="824" y="598" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#865d12">아니요</text>
  <text x="824" y="624" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#865d12">프롬프트+데이터</text>
  <rect x="946" y="566" width="200" height="74" rx="18" fill="#fff1f2" stroke="#e98a9a" stroke-width="2"/>
  <text x="1046" y="598" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#9f1239">예</text>
  <text x="1046" y="624" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#9f1239">파인튜닝 검토</text>

  <text x="600" y="662" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#52677a">후보를 고른 뒤에도 같은 평가표로 기본 모델과 비교한다</text>
</svg>
