<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">불균형 분류의 기준값별 혼동행렬과 정밀도·재현율</title>
  <desc id="desc">실제 양성 4개와 음성 16개인 자료에서 기준값 0.5의 혼동행렬은 TP 2, FP 2, FN 2, TN 14이고 정밀도와 재현율은 모두 50.0퍼센트다. 기준값 0.3에서는 TP 3, FP 4, FN 1, TN 12가 되어 정밀도 42.9퍼센트, 재현율 75.0퍼센트가 된다.</desc>
  <rect width="960" height="560" fill="#f8fafc"/>
  <text x="40" y="48" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">기준값을 낮추면 어떤 칸이 바뀔까?</text>
  <text x="40" y="78" fill="#475569" font-family="Arial, sans-serif" font-size="16">고정 예시: 전체 20개 · 실제 양성 4개 · 실제 음성 16개</text>

  <g font-family="Arial, sans-serif">
    <rect x="40" y="108" width="420" height="340" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="250" y="142" text-anchor="middle" fill="#1e3a8a" font-size="21" font-weight="700">기준값 0.5</text>
    <text x="250" y="168" text-anchor="middle" fill="#475569" font-size="15">점수 0.5 이상을 양성으로 예측</text>
    <text x="255" y="202" text-anchor="middle" fill="#475569" font-size="14">예측 양성</text>
    <text x="365" y="202" text-anchor="middle" fill="#475569" font-size="14">예측 음성</text>
    <text x="93" y="254" fill="#475569" font-size="14">실제 양성</text>
    <text x="93" y="344" fill="#475569" font-size="14">실제 음성</text>
    <rect x="185" y="216" width="140" height="78" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="255" y="247" text-anchor="middle" fill="#166534" font-size="16" font-weight="700">TP</text>
    <text x="255" y="276" text-anchor="middle" fill="#14532d" font-size="26" font-weight="700">2</text>
    <rect x="335" y="216" width="100" height="78" rx="10" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
    <text x="385" y="247" text-anchor="middle" fill="#991b1b" font-size="16" font-weight="700">FN</text>
    <text x="385" y="276" text-anchor="middle" fill="#7f1d1d" font-size="26" font-weight="700">2</text>
    <rect x="185" y="304" width="140" height="78" rx="10" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
    <text x="255" y="335" text-anchor="middle" fill="#9a3412" font-size="16" font-weight="700">FP</text>
    <text x="255" y="364" text-anchor="middle" fill="#7c2d12" font-size="26" font-weight="700">2</text>
    <rect x="335" y="304" width="100" height="78" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <text x="385" y="335" text-anchor="middle" fill="#1e40af" font-size="16" font-weight="700">TN</text>
    <text x="385" y="364" text-anchor="middle" fill="#1e3a8a" font-size="26" font-weight="700">14</text>
    <text x="250" y="420" text-anchor="middle" fill="#334155" font-size="17" font-weight="700">정밀도 50.0% · 재현율 50.0%</text>

    <path d="M475 276 H515" stroke="#64748b" stroke-width="3"/>
    <path d="M505 268 L517 276 L505 284" fill="none" stroke="#64748b" stroke-width="3"/>
    <text x="496" y="257" text-anchor="middle" fill="#475569" font-size="13">낮춤</text>

    <rect x="530" y="108" width="390" height="340" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="725" y="142" text-anchor="middle" fill="#9a3412" font-size="21" font-weight="700">기준값 0.3</text>
    <text x="725" y="168" text-anchor="middle" fill="#475569" font-size="15">점수 0.3 이상을 양성으로 예측</text>
    <text x="690" y="202" text-anchor="middle" fill="#475569" font-size="14">예측 양성</text>
    <text x="825" y="202" text-anchor="middle" fill="#475569" font-size="14">예측 음성</text>
    <text x="548" y="254" fill="#475569" font-size="14">실제 양성</text>
    <text x="548" y="344" fill="#475569" font-size="14">실제 음성</text>
    <rect x="620" y="216" width="140" height="78" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="690" y="247" text-anchor="middle" fill="#166534" font-size="16" font-weight="700">TP</text>
    <text x="690" y="276" text-anchor="middle" fill="#14532d" font-size="26" font-weight="700">3</text>
    <rect x="770" y="216" width="100" height="78" rx="10" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
    <text x="820" y="247" text-anchor="middle" fill="#991b1b" font-size="16" font-weight="700">FN</text>
    <text x="820" y="276" text-anchor="middle" fill="#7f1d1d" font-size="26" font-weight="700">1</text>
    <rect x="620" y="304" width="140" height="78" rx="10" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
    <text x="690" y="335" text-anchor="middle" fill="#9a3412" font-size="16" font-weight="700">FP</text>
    <text x="690" y="364" text-anchor="middle" fill="#7c2d12" font-size="26" font-weight="700">4</text>
    <rect x="770" y="304" width="100" height="78" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <text x="820" y="335" text-anchor="middle" fill="#1e40af" font-size="16" font-weight="700">TN</text>
    <text x="820" y="364" text-anchor="middle" fill="#1e3a8a" font-size="26" font-weight="700">12</text>
    <text x="725" y="420" text-anchor="middle" fill="#334155" font-size="17" font-weight="700">정밀도 42.9% · 재현율 75.0%</text>
  </g>

  <rect x="115" y="478" width="730" height="54" rx="15" fill="#e2e8f0"/>
  <text x="480" y="512" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="17" font-weight="700">양성을 더 찾음: TP 2→3 · 놓친 양성 감소: FN 2→1 · 거짓 알림 증가: FP 2→4</text>
</svg>
