  <path d="M480 404 V438" stroke="#64748b" stroke-width="3"/>
  <path d="M472 428 L480 440 L488 428" fill="none" stroke="#64748b" stroke-width="3"/>
  <rect x="166" y="448" width="628" height="76" rx="18" fill="#e2e8f0"/>
  <text x="480" y="480" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="20" font-weight="700">평균 MAE 0.398 · 표준편차 0.095</text>
  <text x="480" y="507" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="15">평균과 함께 폴드별 흔들림을 확인한다</text>
</svg>
