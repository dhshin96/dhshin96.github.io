<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">로지스틱 회귀의 점수, 확률, 클래스 변환</title>
  <desc id="desc">입력 x가 선형 점수 z=2x-5와 시그모이드 함수를 거쳐 클래스 1의 확률이 되고, 0.5 기준으로 이진 클래스가 되는 과정을 보여 준다. x가 2, 2.5, 3일 때 확률은 각각 0.269, 0.500, 0.731이며 예측 클래스는 0, 1, 1이다.</desc>
  <rect width="960" height="560" fill="#f8fafc"/>
  <text x="40" y="50" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">선형 점수를 확률로 바꾸는 로지스틱 회귀</text>
  <text x="40" y="80" fill="#475569" font-family="Arial, sans-serif" font-size="16">고정 예시: z = 2x - 5 · 분류 기준 p ≥ 0.5</text>

  <g font-family="Arial, sans-serif">
    <rect x="48" y="118" width="186" height="94" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="141" y="150" text-anchor="middle" fill="#334155" font-size="16">입력</text>
    <text x="141" y="186" text-anchor="middle" fill="#0f172a" font-size="25" font-weight="700">x</text>

    <path d="M234 165 H286" stroke="#64748b" stroke-width="3"/>
    <path d="M278 158 L290 165 L278 172" fill="none" stroke="#64748b" stroke-width="3"/>

    <rect x="290" y="118" width="186" height="94" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="383" y="150" text-anchor="middle" fill="#1e40af" font-size="16">선형 점수</text>
    <text x="383" y="186" text-anchor="middle" fill="#1e3a8a" font-size="25" font-weight="700">z = 2x - 5</text>

    <path d="M476 165 H528" stroke="#64748b" stroke-width="3"/>
    <path d="M520 158 L532 165 L520 172" fill="none" stroke="#64748b" stroke-width="3"/>

    <rect x="532" y="118" width="186" height="94" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="625" y="150" text-anchor="middle" fill="#047857" font-size="16">시그모이드 확률</text>
    <text x="625" y="186" text-anchor="middle" fill="#065f46" font-size="22" font-weight="700">p = 1 / (1 + e⁻ᶻ)</text>

    <path d="M718 165 H770" stroke="#64748b" stroke-width="3"/>
    <path d="M762 158 L774 165 L762 172" fill="none" stroke="#64748b" stroke-width="3"/>

    <rect x="774" y="118" width="138" height="94" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="843" y="150" text-anchor="middle" fill="#9a3412" font-size="16">예측 클래스</text>
    <text x="843" y="186" text-anchor="middle" fill="#7c2d12" font-size="22" font-weight="700">0 또는 1</text>
  </g>

  <rect x="48" y="250" width="864" height="228" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="140" y="290" fill="#475569" font-size="16" font-weight="700">입력 x</text>
    <text x="340" y="290" fill="#475569" font-size="16" font-weight="700">선형 점수 z</text>
    <text x="565" y="290" fill="#475569" font-size="16" font-weight="700">클래스 1 확률 p</text>
    <text x="805" y="290" fill="#475569" font-size="16" font-weight="700">예측</text>
    <line x1="82" y1="308" x2="878" y2="308" stroke="#cbd5e1"/>

    <g fill="#1e293b" font-size="19">
      <text x="140" y="346">2.0</text><text x="340" y="346">-1</text><text x="565" y="346">0.269</text>
      <text x="140" y="398">2.5</text><text x="340" y="398">0</text><text x="565" y="398">0.500</text>
      <text x="140" y="450">3.0</text><text x="340" y="450">1</text><text x="565" y="450">0.731</text>
    </g>
    <g font-size="18" font-weight="700">
      <rect x="756" y="322" width="98" height="32" rx="16" fill="#e2e8f0"/><text x="805" y="345" fill="#334155">0</text>
      <rect x="756" y="374" width="98" height="32" rx="16" fill="#dbeafe"/><text x="805" y="397" fill="#1d4ed8">1</text>
      <rect x="756" y="426" width="98" height="32" rx="16" fill="#dbeafe"/><text x="805" y="449" fill="#1d4ed8">1</text>
    </g>
  </g>

  <text x="48" y="520" fill="#475569" font-family="Arial, sans-serif" font-size="15">시그모이드는 점수의 순서를 유지하면서 범위를 0과 1 사이로 제한한다. 기준값은 확률 계산 뒤에 적용한다.</text>
</svg>
