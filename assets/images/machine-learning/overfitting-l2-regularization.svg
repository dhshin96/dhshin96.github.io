<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">L2 규제 강도에 따른 8차 다항식의 과대적합과 과소적합</title>
  <desc id="desc">아홉 학습점에 맞춘 8차 다항식을 비교한다. 알파 0은 학습 MSE 0.000, 검증 MSE 0.188로 과대적합한다. 알파 0.01은 학습 MSE 0.025, 검증 MSE 0.008이다. 알파 10은 학습 MSE 0.521, 검증 MSE 0.563으로 과소적합한다.</desc>
  <rect width="960" height="560" fill="#f8fafc"/>
  <text x="40" y="45" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">규제는 학습 오차와 검증 오차의 균형을 바꾼다</text>
  <text x="40" y="75" fill="#475569" font-family="Arial, sans-serif" font-size="16">주황색 점은 학습 자료 · 회색 점선은 숨은 직선 y = 1 + 2x · 파란색은 학습한 8차식</text>

  <g font-family="Arial, sans-serif">
