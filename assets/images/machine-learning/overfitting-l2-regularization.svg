      <text x="490" y="417" fill="#047857" font-size="15" font-weight="700">검증 MSE 0.008</text>
      <text x="490" y="444" fill="#64748b" font-size="14">계수 제곱합 4.820</text>

      <text x="800" y="365" fill="#0f172a" font-size="19" font-weight="700">α = 10 · 과소적합</text>
      <text x="800" y="393" fill="#334155" font-size="15">학습 MSE 0.521</text>
      <text x="800" y="417" fill="#b91c1c" font-size="15" font-weight="700">검증 MSE 0.563</text>
      <text x="800" y="444" fill="#64748b" font-size="14">계수 제곱합 0.323</text>
    </g>

    <rect x="245" y="474" width="470" height="28" rx="14" fill="#dcfce7"/>
    <text x="480" y="494" text-anchor="middle" fill="#166534" font-size="15" font-weight="700">작은 학습 오차 하나가 아니라, 낮은 검증 오차를 고른다</text>
