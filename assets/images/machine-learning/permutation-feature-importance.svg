<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">세 특성의 순열 중요도 계산</title>
  <desc id="desc">검증 정확도 1.000인 모델에서 공부 시간, 출석 횟수, 좌석 번호를 한 열씩 섞는다. 섞은 평균 정확도는 각각 0.487, 0.713, 1.000이고 기준 점수와의 차이인 순열 중요도는 0.512, 0.287, 0.000이다.</desc>
  <rect width="960" height="560" fill="#f8fafc"/>
  <text x="40" y="48" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">한 열을 섞으면 검증 점수가 얼마나 떨어질까?</text>
  <text x="40" y="78" fill="#475569" font-family="Arial, sans-serif" font-size="16">기준 정확도 1.000 · 한 번에 한 특성만 10회 순열</text>

  <g font-family="Arial, sans-serif">
    <rect x="40" y="112" width="240" height="310" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="160" y="148" text-anchor="middle" fill="#1e3a8a" font-size="20" font-weight="700">① 원래 검증 자료</text>
    <text x="75" y="188" fill="#475569" font-size="14">공부</text>
    <text x="145" y="188" fill="#475569" font-size="14">출석</text>
    <text x="215" y="188" fill="#475569" font-size="14">좌석</text>
    <g fill="#dbeafe" stroke="#60a5fa">
      <rect x="62" y="202" width="56" height="36" rx="7"/><rect x="132" y="202" width="56" height="36" rx="7"/><rect x="202" y="202" width="56" height="36" rx="7"/>
      <rect x="62" y="248" width="56" height="36" rx="7"/><rect x="132" y="248" width="56" height="36" rx="7"/><rect x="202" y="248" width="56" height="36" rx="7"/>
      <rect x="62" y="294" width="56" height="36" rx="7"/><rect x="132" y="294" width="56" height="36" rx="7"/><rect x="202" y="294" width="56" height="36" rx="7"/>
    </g>
    <g text-anchor="middle" fill="#1e3a8a" font-size="15" font-weight="700">
      <text x="90" y="226">1</text><text x="160" y="226">8</text><text x="230" y="226">12</text>
      <text x="90" y="272">2</text><text x="160" y="272">6</text><text x="230" y="272">41</text>
      <text x="90" y="318">3</text><text x="160" y="318">4</text><text x="230" y="318">7</text>
    </g>
    <text x="160" y="356" text-anchor="middle" fill="#64748b" font-size="16">⋮</text>
    <rect x="72" y="374" width="176" height="34" rx="10" fill="#dcfce7"/>
    <text x="160" y="397" text-anchor="middle" fill="#166534" font-size="17" font-weight="700">정확도 1.000</text>

    <path d="M300 267 H348" stroke="#64748b" stroke-width="3"/>
    <path d="M338 259 L350 267 L338 275" fill="none" stroke="#64748b" stroke-width="3"/>

    <rect x="370" y="112" width="550" height="310" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="645" y="148" text-anchor="middle" fill="#9a3412" font-size="20" font-weight="700">② 한 열씩 섞고 정확도 다시 계산</text>

    <text x="404" y="200" fill="#334155" font-size="17" font-weight="700">공부 시간</text>
    <rect x="510" y="178" width="270" height="28" rx="8" fill="#e2e8f0"/>
    <rect x="510" y="178" width="138" height="28" rx="8" fill="#2563eb"/>
    <text x="795" y="199" fill="#1e3a8a" font-size="16" font-weight="700">0.512</text>
    <text x="404" y="228" fill="#64748b" font-size="14">섞은 정확도 0.487</text>

    <text x="404" y="278" fill="#334155" font-size="17" font-weight="700">출석 횟수</text>
    <rect x="510" y="256" width="270" height="28" rx="8" fill="#e2e8f0"/>
    <rect x="510" y="256" width="77" height="28" rx="8" fill="#0ea5e9"/>
    <text x="795" y="277" fill="#075985" font-size="16" font-weight="700">0.287</text>
    <text x="404" y="306" fill="#64748b" font-size="14">섞은 정확도 0.713</text>

    <text x="404" y="356" fill="#334155" font-size="17" font-weight="700">좌석 번호</text>
    <rect x="510" y="334" width="270" height="28" rx="8" fill="#e2e8f0"/>
    <circle cx="514" cy="348" r="5" fill="#94a3b8"/>
    <text x="795" y="355" fill="#475569" font-size="16" font-weight="700">0.000</text>
    <text x="404" y="384" fill="#64748b" font-size="14">섞은 정확도 1.000</text>
  </g>

  <rect x="94" y="458" width="772" height="70" rx="16" fill="#e2e8f0"/>
  <text x="480" y="487" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="17" font-weight="700">순열 중요도 = 기준 점수 − 섞은 점수의 평균</text>
  <text x="480" y="513" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="15">큰 감소는 이 모델의 높은 의존도를 뜻하지만, 특성의 인과 효과를 뜻하지 않는다.</text>
</svg>
