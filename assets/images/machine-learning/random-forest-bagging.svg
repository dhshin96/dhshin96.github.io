<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">배깅과 랜덤 포레스트의 다섯 나무 투표</title>
  <desc id="desc">여덟 개 학습 자료에서 복원추출한 서로 다른 표본과 무작위 특성으로 다섯 결정트리를 만든다. 새 입력에 대한 예측은 1, 0, 1, 0, 0이며 클래스 0이 세 표를 얻어 최종 예측은 0이다.</desc>
  <rect width="960" height="560" fill="#f8fafc"/>
  <text x="40" y="50" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">다른 표본·다른 질문, 하나의 최종 예측</text>
  <text x="40" y="80" fill="#475569" font-family="Arial, sans-serif" font-size="16">고정 예시: 8개 자료 · 5개 결정 그루터기 · 입력 (3.5, 6)</text>

  <g font-family="Arial, sans-serif">
    <rect x="40" y="118" width="180" height="126" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="130" y="153" text-anchor="middle" fill="#334155" font-size="17" font-weight="700">원래 학습 자료</text>
    <text x="130" y="190" text-anchor="middle" fill="#0f172a" font-size="25" font-weight="700">1 · 2 · 3 · 4</text>
    <text x="130" y="221" text-anchor="middle" fill="#0f172a" font-size="25" font-weight="700">5 · 6 · 7 · 8</text>

    <path d="M220 181 H278" stroke="#64748b" stroke-width="3"/>
    <path d="M268 173 L280 181 L268 189" fill="none" stroke="#64748b" stroke-width="3"/>
    <text x="250" y="164" text-anchor="middle" fill="#475569" font-size="14">복원추출</text>

    <g font-size="15">
      <rect x="280" y="105" width="350" height="46" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
      <text x="300" y="134" fill="#1e3a8a" font-weight="700">나무 1</text><text x="380" y="134" fill="#334155">[8,5,6,3,7,1,6,8] · 특성 2</text>
      <circle cx="602" cy="128" r="16" fill="#2563eb"/><text x="602" y="134" text-anchor="middle" fill="#ffffff" font-weight="700">1</text>

      <rect x="280" y="163" width="350" height="46" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
      <text x="300" y="192" fill="#9a3412" font-weight="700">나무 2</text><text x="380" y="192" fill="#334155">[8,4,1,3,8,6,3,6] · 특성 1</text>
      <circle cx="602" cy="186" r="16" fill="#ea580c"/><text x="602" y="192" text-anchor="middle" fill="#ffffff" font-weight="700">0</text>

      <rect x="280" y="221" width="350" height="46" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
      <text x="300" y="250" fill="#1e3a8a" font-weight="700">나무 3</text><text x="380" y="250" fill="#334155">[1,4,2,6,7,2,1,1] · 특성 1</text>
      <circle cx="602" cy="244" r="16" fill="#2563eb"/><text x="602" y="250" text-anchor="middle" fill="#ffffff" font-weight="700">1</text>

      <rect x="280" y="279" width="350" height="46" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
      <text x="300" y="308" fill="#9a3412" font-weight="700">나무 4</text><text x="380" y="308" fill="#334155">[2,7,8,2,7,3,6,3] · 특성 1</text>
      <circle cx="602" cy="302" r="16" fill="#ea580c"/><text x="602" y="308" text-anchor="middle" fill="#ffffff" font-weight="700">0</text>

      <rect x="280" y="337" width="350" height="46" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
      <text x="300" y="366" fill="#9a3412" font-weight="700">나무 5</text><text x="380" y="366" fill="#334155">[3,2,7,7,8,8,7,1] · 특성 1</text>
      <circle cx="602" cy="360" r="16" fill="#ea580c"/><text x="602" y="366" text-anchor="middle" fill="#ffffff" font-weight="700">0</text>
    </g>

    <path d="M630 244 H700" stroke="#64748b" stroke-width="3"/>
    <path d="M690 236 L702 244 L690 252" fill="none" stroke="#64748b" stroke-width="3"/>
    <text x="666" y="225" text-anchor="middle" fill="#475569" font-size="14">다수결</text>

    <rect x="704" y="155" width="216" height="178" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="812" y="194" text-anchor="middle" fill="#047857" font-size="18" font-weight="700">다섯 예측</text>
    <text x="812" y="235" text-anchor="middle" fill="#065f46" font-size="27" font-weight="700">1 · 0 · 1 · 0 · 0</text>
    <text x="812" y="276" text-anchor="middle" fill="#047857" font-size="18">0은 3표 · 1은 2표</text>
    <text x="812" y="310" text-anchor="middle" fill="#065f46" font-size="22" font-weight="700">최종 예측 = 0</text>
  </g>

  <rect x="160" y="430" width="640" height="78" rx="18" fill="#e2e8f0"/>
  <text x="480" y="462" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="17" font-weight="700">배깅: 부트스트랩 표본으로 행을 바꾼다</text>
  <text x="480" y="491" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="17" font-weight="700">랜덤 포레스트: 각 분할에서 볼 특성도 무작위로 제한한다</text>
</svg>
