<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">학습 검증 테스트 데이터의 역할</title>
  <desc id="desc">10개 합성 자료를 학습 6개, 검증 2개, 테스트 2개로 나눈다. 학습 세트로 평균 규칙과 가장 가까운 값 규칙을 만들고, 검증 평균절대오차 8점과 4점을 비교해 가장 가까운 값 규칙을 선택한다. 선택이 끝난 뒤 테스트 세트에서 최종 평균절대오차 4점을 한 번 확인한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  </defs>
  <rect width="960" height="560" fill="#f8fafc"/>
  <text x="40" y="50" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">세 세트가 맡는 서로 다른 결정</text>
  <text x="40" y="80" fill="#475569" font-family="Arial, sans-serif" font-size="16">합성 자료 10개 · 평균절대오차(MAE) 비교</text>

  <rect x="40" y="108" width="880" height="76" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="65" y="139" fill="#334155" font-family="Arial, sans-serif" font-size="16" font-weight="700">전체 자료 D</text>
  <g font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">
    <rect x="190" y="126" width="390" height="40" rx="8" fill="#dbeafe"/><text x="385" y="152" fill="#1e3a8a">학습 6개</text>
    <rect x="590" y="126" width="145" height="40" rx="8" fill="#fef3c7"/><text x="662" y="152" fill="#92400e">검증 2개</text>
    <rect x="745" y="126" width="145" height="40" rx="8" fill="#dcfce7"/><text x="817" y="152" fill="#166534">테스트 2개</text>
  </g>

  <path d="M385 184V220 M662 184V220 M817 184V400" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="105" y="222" width="560" height="112" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="130" y="253" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="18" font-weight="700">학습: 후보 규칙 만들기</text>
  <rect x="130" y="270" width="235" height="42" rx="8" fill="#eff6ff"/>
  <rect x="385" y="270" width="255" height="42" rx="8" fill="#eff6ff"/>
  <g fill="#1e293b" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">
    <text x="247" y="297">평균 규칙</text><text x="512" y="297">가장 가까운 값 규칙</text>
  </g>

  <path d="M385 334V369" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="105" y="371" width="560" height="105" rx="14" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/>
  <text x="130" y="402" fill="#92400e" font-family="Arial, sans-serif" font-size="18" font-weight="700">검증: 두 후보 비교하고 선택</text>
  <text x="130" y="436" fill="#334155" font-family="Arial, sans-serif" font-size="18">평균 규칙 8.0점</text>
  <text x="385" y="436" fill="#166534" font-family="Arial, sans-serif" font-size="18" font-weight="700">가장 가까운 값 규칙 4.0점 ✓</text>
  <text x="130" y="462" fill="#64748b" font-family="Arial, sans-serif" font-size="15">검증 MAE가 작은 두 번째 규칙을 선택</text>

  <rect x="705" y="402" width="215" height="74" rx="14" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <text x="812" y="432" fill="#166534" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">테스트: 마지막 확인</text>
  <text x="812" y="460" fill="#14532d" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">최종 MAE 4.0점</text>

  <path d="M665 423H695" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M705 500H665" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="470" y="520" fill="#991b1b" font-family="Arial, sans-serif" font-size="16" font-weight="700">테스트 결과를 모델 선택으로 되돌리지 않는다</text>
  <text x="40" y="548" fill="#475569" font-family="Arial, sans-serif" font-size="15">역할: 만들기 → 고르기 → 선택이 끝난 뒤 한 번 확인하기</text>
</svg>
