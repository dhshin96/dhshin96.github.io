<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Cox 비례위험모형의 일정한 위험비</title>
  <desc id="desc">시간에 따라 기준 위험과 비교 집단 위험이 함께 변하지만 비교 집단의 위험이 항상 기준의 두 배여서 위험비가 2로 일정한 모습을 보여준다.</desc>
  <rect width="920" height="500" rx="28" fill="#fffefa"/>
  <text x="460" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1b211d">위험은 변해도 위험비는 일정할 수 있다</text>

  <line x1="92" y1="82" x2="92" y2="392" stroke="#3e4640" stroke-width="2"/>
  <line x1="92" y1="392" x2="850" y2="392" stroke="#3e4640" stroke-width="2"/>
  <text x="30" y="237" transform="rotate(-90 30 237)" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#3e4640">순간 위험 h(t)</text>
  <text x="470" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#3e4640">시간 t</text>

  <path d="M92 345 C170 315 205 335 275 292 S392 225 465 252 S588 330 660 285 S770 160 850 188" fill="none" stroke="#176b52" stroke-width="5"/>
  <path d="M92 298 C170 238 205 278 275 192 S392 58 465 112 S588 268 660 178 S770 28 850 76" fill="none" stroke="#e9783d" stroke-width="5"/>

  <line x1="465" y1="112" x2="465" y2="252" stroke="#70766f" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M453 126 L465 112 L477 126" fill="none" stroke="#70766f" stroke-width="2"/>
  <path d="M453 238 L465 252 L477 238" fill="none" stroke="#70766f" stroke-width="2"/>
  <rect x="490" y="151" width="152" height="58" rx="14" fill="#ffffff" stroke="#dcded7"/>
  <text x="566" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#3e4640">모든 시점에서</text>
  <text x="566" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#b44c1f">위험비 = 2</text>

  <rect x="128" y="104" width="202" height="82" rx="15" fill="#ffffff" stroke="#dcded7"/>
  <line x1="150" y1="131" x2="188" y2="131" stroke="#e9783d" stroke-width="5"/>
  <text x="202" y="137" font-family="Arial, sans-serif" font-size="16" fill="#3e4640">h(t | x=1)</text>
  <line x1="150" y1="160" x2="188" y2="160" stroke="#176b52" stroke-width="5"/>
  <text x="202" y="166" font-family="Arial, sans-serif" font-size="16" fill="#3e4640">h₀(t), x=0</text>

  <rect x="185" y="454" width="550" height="30" rx="12" fill="#edf6f0"/>
  <text x="460" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#176b52">두 곡선의 높이는 달라져도 한 곡선이 다른 곡선의 일정한 배수다.</text>
</svg>
