<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">랜드마크별 Brier 점수와 시간 4 보정 비교</title>
  <desc id="desc">왼쪽은 시간 2, 4, 6의 4시간 생존예측 Brier 점수를 막대로 비교한다. 오른쪽은 시간 4의 낮은 예측군과 높은 예측군에서 평균 예측 생존확률과 실제 생존 비율을 완전 보정 대각선과 비교한다.</desc>
  <rect width="960" height="540" rx="24" fill="#f8fafc"/>
  <text x="48" y="54" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="700" fill="#0f172a">동적 예측은 전체 오차와 보정 방향을 함께 본다</text>
  <text x="48" y="82" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#475569">같은 4시간 예측창 · 검열이 끝점 뒤인 설명용 합성 자료</text>

  <rect x="40" y="108" width="405" height="382" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="143" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1e293b">랜드마크별 Brier 점수</text>
  <text x="64" y="166" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#64748b">낮을수록 예측확률과 실제 상태가 가깝다</text>
  <line x1="92" y1="420" x2="404" y2="420" stroke="#94a3b8" stroke-width="2"/>
  <line x1="92" y1="205" x2="92" y2="420" stroke="#94a3b8" stroke-width="2"/>
  <g font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#64748b">
    <text x="54" y="424">0.00</text><text x="54" y="321">0.10</text><text x="54" y="218">0.20</text>
    <text x="130" y="449">s=2</text><text x="231" y="449">s=4</text><text x="332" y="449">s=6</text>
  </g>
  <line x1="92" y1="317" x2="404" y2="317" stroke="#e2e8f0" stroke-dasharray="5 5"/>
  <line x1="92" y1="214" x2="404" y2="214" stroke="#e2e8f0" stroke-dasharray="5 5"/>
  <rect x="123" y="303" width="54" height="117" rx="7" fill="#38bdf8"/>
  <rect x="224" y="227" width="54" height="193" rx="7" fill="#0ea5e9"/>
  <rect x="325" y="220" width="54" height="200" rx="7" fill="#0284c7"/>
  <g font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">
    <text x="150" y="292">0.114</text><text x="251" y="216">0.187</text><text x="352" y="209">0.194</text>
  </g>
  <text x="248" y="474" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" text-anchor="middle" fill="#64748b">평가 시점 s (끝점은 s+4)</text>

  <rect x="465" y="108" width="455" height="382" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="489" y="143" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1e293b">시간 4의 보정: 예측과 관찰 비교</text>
  <text x="489" y="166" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#64748b">점이 대각선에 가까울수록 생존확률 보정이 좋다</text>
  <line x1="520" y1="420" x2="860" y2="420" stroke="#94a3b8" stroke-width="2"/>
  <line x1="520" y1="420" x2="520" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="520" y1="420" x2="860" y2="200" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <g font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#64748b">
    <text x="503" y="438">0</text><text x="680" y="438">0.5</text><text x="851" y="438">1.0</text>
    <text x="494" y="424">0</text><text x="488" y="314">0.5</text><text x="484" y="205">1.0</text>
  </g>
  <text x="690" y="468" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" text-anchor="middle" fill="#475569">평균 예측 생존확률</text>
  <text x="481" y="310" transform="rotate(-90 481 310)" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" text-anchor="middle" fill="#475569">실제 생존 비율</text>
  <circle cx="724" cy="420" r="10" fill="#f97316" stroke="#ffffff" stroke-width="3"/>
  <circle cx="784" cy="200" r="10" fill="#16a34a" stroke="#ffffff" stroke-width="3"/>
  <path d="M724 420 L661 382" stroke="#f97316" stroke-width="2"/>
  <rect x="552" y="337" width="144" height="50" rx="9" fill="#fff7ed" stroke="#fdba74"/>
  <text x="564" y="358" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#9a3412">낮은 예측군</text>
  <text x="564" y="377" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#9a3412">예측 0.600 · 실제 0</text>
  <path d="M784 200 L809 240" stroke="#16a34a" stroke-width="2"/>
  <rect x="750" y="238" width="148" height="50" rx="9" fill="#f0fdf4" stroke="#86efac"/>
  <text x="762" y="259" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#166534">높은 예측군</text>
  <text x="762" y="278" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#166534">예측 0.775 · 실제 1</text>
</svg>
