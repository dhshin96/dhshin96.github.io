<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">세 랜드마크의 동적 AUC 비교</title>
  <desc id="desc">시간 2, 4, 6에서 길이 4의 예측창을 적용해 사례와 대조군을 다시 정하고 AUC 0.833, 0.917, 0.889를 비교한다</desc>
  <rect width="960" height="560" rx="24" fill="#f8fafc"/>
  <text x="48" y="58" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#0f172a">랜드마크가 이동하면 비교할 쌍도 바뀐다</text>
  <text x="48" y="91" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#475569">같은 4시간 예측창 · 높은 위험 점수가 사례에 먼저 오면 정렬 성공</text>

  <g font-family="Arial, 'Noto Sans KR', sans-serif">
    <rect x="48" y="126" width="264" height="310" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="72" y="164" font-size="20" font-weight="700" fill="#1e3a8a">s=2 → h=6</text>
    <text x="72" y="202" font-size="17" fill="#334155">사례 2명 · 대조군 6명</text>
    <rect x="72" y="229" width="86" height="36" rx="18" fill="#fee2e2"/>
    <text x="115" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">사례 A, B</text>
    <rect x="169" y="229" width="116" height="36" rx="18" fill="#dbeafe"/>
    <text x="227" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">대조군 6명</text>
    <text x="72" y="309" font-size="16" fill="#475569">맞은 순서</text>
    <text x="285" y="309" text-anchor="end" font-size="18" font-weight="700" fill="#0f172a">10 / 12</text>
    <rect x="72" y="332" width="213" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="72" y="332" width="177" height="18" rx="9" fill="#2563eb"/>
    <text x="178" y="397" text-anchor="middle" font-size="34" font-weight="700" fill="#1d4ed8">AUC 0.833</text>

    <rect x="348" y="126" width="264" height="310" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
    <text x="372" y="164" font-size="20" font-weight="700" fill="#1e3a8a">s=4 → h=8</text>
    <text x="372" y="202" font-size="17" fill="#334155">사례 3명 · 대조군 4명</text>
    <rect x="372" y="229" width="105" height="36" rx="18" fill="#fee2e2"/>
    <text x="425" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">사례 B,D,E</text>
    <rect x="489" y="229" width="96" height="36" rx="18" fill="#dbeafe"/>
    <text x="537" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">대조군 4명</text>
    <text x="372" y="309" font-size="16" fill="#475569">맞은 순서</text>
    <text x="585" y="309" text-anchor="end" font-size="18" font-weight="700" fill="#0f172a">11 / 12</text>
    <rect x="372" y="332" width="213" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="372" y="332" width="195" height="18" rx="9" fill="#2563eb"/>
    <text x="478" y="397" text-anchor="middle" font-size="34" font-weight="700" fill="#1d4ed8">AUC 0.917</text>

    <rect x="648" y="126" width="264" height="310" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="672" y="164" font-size="20" font-weight="700" fill="#1e3a8a">s=6 → h=10</text>
    <text x="672" y="202" font-size="17" fill="#334155">사례 3명 · 대조군 3명</text>
    <rect x="672" y="229" width="105" height="36" rx="18" fill="#fee2e2"/>
    <text x="725" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">사례 D,E,G</text>
    <rect x="789" y="229" width="96" height="36" rx="18" fill="#dbeafe"/>
    <text x="837" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">대조군 3명</text>
    <text x="672" y="309" font-size="16" fill="#475569">맞은 순서</text>
    <text x="885" y="309" text-anchor="end" font-size="18" font-weight="700" fill="#0f172a">8 / 9</text>
    <rect x="672" y="332" width="213" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="672" y="332" width="189" height="18" rx="9" fill="#2563eb"/>
    <text x="778" y="397" text-anchor="middle" font-size="34" font-weight="700" fill="#1d4ed8">AUC 0.889</text>

    <path d="M48 474 H912" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="69" cy="509" r="9" fill="#ef4444"/>
    <text x="87" y="515" font-size="16" fill="#334155">누적 사례: 끝점까지 사건 발생</text>
    <circle cx="395" cy="509" r="9" fill="#3b82f6"/>
    <text x="413" y="515" font-size="16" fill="#334155">동적 대조군: 끝점을 지나 사건 없음</text>
  </g>
</svg>

