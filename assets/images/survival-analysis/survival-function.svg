<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Kaplan-Meier 생존함수의 계단 곡선</title>
  <desc id="desc">생존확률은 사건 시점에 내려가고 검열 시점에는 표시만 추가된다.</desc>
  <rect width="920" height="500" rx="28" fill="#fffefa"/>
  <text x="460" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1b211d">시간에 따른 생존확률 S(t)</text>
  <line x1="120" y1="400" x2="840" y2="400" stroke="#68706a" stroke-width="3"/>
  <line x1="120" y1="400" x2="120" y2="75" stroke="#68706a" stroke-width="3"/>
  <text x="850" y="426" font-family="Arial, sans-serif" font-size="15" fill="#68706a">시간 t</text>
  <text x="82" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#176b52">S(t)</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#68706a">
    <text x="96" y="80">1.0</text><text x="88" y="245">0.5</text><text x="100" y="405">0</text>
    <text x="116" y="428">0</text><text x="254" y="428">2</text><text x="394" y="428">4</text><text x="604" y="428">7</text><text x="808" y="428">10</text>
  </g>
  <line x1="120" y1="238" x2="820" y2="238" stroke="#dcded7" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M120 75H260V116H400V210H610V274H820V400" fill="none" stroke="#176b52" stroke-width="8" stroke-linejoin="round"/>
  <g stroke="#e9783d" stroke-width="5">
    <line x1="323" y1="104" x2="337" y2="128"/><line x1="337" y1="104" x2="323" y2="128"/>
    <line x1="533" y1="198" x2="547" y2="222"/><line x1="547" y1="198" x2="533" y2="222"/>
    <line x1="673" y1="262" x2="687" y2="286"/><line x1="687" y1="262" x2="673" y2="286"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <text x="270" y="103" fill="#176b52">사건</text><text x="410" y="197" fill="#176b52">사건</text><text x="620" y="261" fill="#176b52">사건</text>
    <text x="330" y="94" text-anchor="middle" fill="#b44c1f">검열</text><text x="540" y="188" text-anchor="middle" fill="#b44c1f">검열</text><text x="680" y="252" text-anchor="middle" fill="#b44c1f">검열</text>
  </g>
  <rect x="466" y="102" width="182" height="68" rx="14" fill="#d9eadf"/>
  <text x="557" y="131" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#176b52">Ŝ(4) = 0.583</text>
  <text x="557" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3e4640">4를 넘어 생존할 확률</text>
</svg>
