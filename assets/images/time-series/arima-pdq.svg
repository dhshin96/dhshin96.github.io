<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">ARIMA p d q 계산 흐름</title>
  <desc id="desc">ARIMA(1,1,1)에서 원계열을 한 번 차분하고 직전 변화량과 직전 오차로 변화량 예측 1.97과 수준 예측 140.97을 만드는 과정</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .accent { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .warm { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .result { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
      .title { font: 700 28px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #0f172a; }
      .label { font: 700 21px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #0f172a; }
      .text { font: 500 17px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #334155; }
      .math { font: 700 20px 'Consolas', monospace; fill: #0f172a; }
      .small { font: 500 15px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#head); }
    </style>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="600" rx="20"/>
  <text class="title" x="480" y="50" text-anchor="middle">ARIMA(1,1,1): 세 숫자가 예측값을 만드는 순서</text>

  <rect class="panel" x="55" y="90" width="250" height="135" rx="16"/>
  <text class="label" x="180" y="125" text-anchor="middle">원계열</text>
  <text class="math" x="180" y="165" text-anchor="middle">136 → 139 → 144</text>
  <text class="small" x="180" y="198" text-anchor="middle">관측한 수준 y</text>

  <path class="arrow" d="M305 157 H365"/>
  <rect class="accent" x="375" y="90" width="250" height="135" rx="16"/>
  <text class="label" x="500" y="125" text-anchor="middle">d = 1</text>
  <text class="math" x="500" y="165" text-anchor="middle">Δy: 3 → 5</text>
  <text class="small" x="500" y="198" text-anchor="middle">한 번 차분한 변화량</text>

  <path class="arrow" d="M625 157 H685"/>
  <rect class="panel" x="695" y="90" width="210" height="135" rx="16"/>
  <text class="label" x="800" y="125" text-anchor="middle">계산 대상</text>
  <text class="math" x="800" y="165" text-anchor="middle">ŷ 변화량</text>
  <text class="small" x="800" y="198" text-anchor="middle">다음 변화량 예측</text>

  <rect class="accent" x="105" y="280" width="300" height="125" rx="16"/>
  <text class="label" x="255" y="315" text-anchor="middle">p = 1 · AR 항</text>
  <text class="math" x="255" y="355" text-anchor="middle">0.6 × 직전 변화량 3</text>
  <text class="small" x="255" y="383" text-anchor="middle">= 1.80</text>

  <rect class="warm" x="555" y="280" width="300" height="125" rx="16"/>
  <text class="label" x="705" y="315" text-anchor="middle">q = 1 · MA 항</text>
  <text class="math" x="705" y="355" text-anchor="middle">0.3 × 직전 오차 0.57</text>
  <text class="small" x="705" y="383" text-anchor="middle">= 0.17</text>

  <path class="arrow" d="M255 405 C255 455 400 450 440 485"/>
  <path class="arrow" d="M705 405 C705 455 560 450 520 485"/>
  <rect class="result" x="250" y="480" width="460" height="90" rx="18"/>
  <text class="label" x="480" y="515" text-anchor="middle">변화량 예측 1.80 + 0.17 = 1.97</text>
  <text class="math" x="480" y="550" text-anchor="middle">수준 예측: 139 + 1.97 = 140.97</text>
</svg>
