<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">분기 시계열의 지연 4 비교와 자기상관함수</title>
  <desc id="desc">10, 20, 30, 40이 세 번 반복되는 시계열에서 4시점 떨어진 같은 값을 점선으로 연결한다. 아래 ACF 막대는 지연 1부터 6까지 각각 -0.05, -0.50, -0.28, 0.67, 0.02, -0.30이며 지연 4를 강조한다.</desc>
  <rect width="960" height="600" rx="20" fill="#f8fbf9"/>
  <text x="42" y="50" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#183d32">자기상관은 반복되는 시간 간격을 찾는다</text>
  <text x="42" y="80" font-family="Arial, sans-serif" font-size="16" fill="#49665d">분기 자료의 같은 위치는 4시점마다 다시 만난다</text>

  <rect x="42" y="108" width="876" height="230" rx="16" fill="#ffffff" stroke="#c9d9d3"/>
  <text x="70" y="143" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#294d42">원계열과 지연 4 비교 쌍</text>
  <line x1="86" y1="280" x2="884" y2="280" stroke="#9bb2aa" stroke-width="2"/>
  <g stroke="#d2691e" stroke-width="2" stroke-dasharray="5 5" opacity="0.7">
    <line x1="98" y1="256" x2="386" y2="256"/><line x1="170" y1="224" x2="458" y2="224"/>
    <line x1="242" y1="192" x2="530" y2="192"/><line x1="314" y1="160" x2="602" y2="160"/>
    <line x1="386" y1="256" x2="674" y2="256"/><line x1="458" y1="224" x2="746" y2="224"/>
    <line x1="530" y1="192" x2="818" y2="192"/><line x1="602" y1="160" x2="890" y2="160"/>
  </g>
  <polyline points="98,256 170,224 242,192 314,160 386,256 458,224 530,192 602,160 674,256 746,224 818,192 890,160" fill="none" stroke="#176b8a" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#176b8a" stroke="#ffffff" stroke-width="2">
    <circle cx="98" cy="256" r="7"/><circle cx="170" cy="224" r="7"/><circle cx="242" cy="192" r="7"/><circle cx="314" cy="160" r="7"/>
    <circle cx="386" cy="256" r="7"/><circle cx="458" cy="224" r="7"/><circle cx="530" cy="192" r="7"/><circle cx="602" cy="160" r="7"/>
    <circle cx="674" cy="256" r="7"/><circle cx="746" cy="224" r="7"/><circle cx="818" cy="192" r="7"/><circle cx="890" cy="160" r="7"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#536b63" text-anchor="middle">
    <text x="98" y="303">1</text><text x="170" y="303">2</text><text x="242" y="303">3</text><text x="314" y="303">4</text>
    <text x="386" y="303">5</text><text x="458" y="303">6</text><text x="530" y="303">7</text><text x="602" y="303">8</text>
    <text x="674" y="303">9</text><text x="746" y="303">10</text><text x="818" y="303">11</text><text x="890" y="303">12</text>
  </g>
  <text x="480" y="327" font-family="Arial, sans-serif" font-size="14" fill="#536b63" text-anchor="middle">점선은 4시점 떨어진 같은 분기를 연결한다</text>

  <rect x="42" y="360" width="876" height="196" rx="16" fill="#ffffff" stroke="#c9d9d3"/>
  <text x="70" y="395" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#294d42">지연별 자기상관(ACF)</text>
  <line x1="98" y1="466" x2="884" y2="466" stroke="#7c958c" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
    <rect x="145" y="466" width="70" height="5" rx="3" fill="#6d8896"/><text x="180" y="493" fill="#536b63">-0.05</text><text x="180" y="533" fill="#536b63">지연 1</text>
    <rect x="265" y="466" width="70" height="50" rx="5" fill="#6d8896"/><text x="300" y="539" fill="#536b63">-0.50</text><text x="300" y="555" fill="#536b63">지연 2</text>
    <rect x="385" y="466" width="70" height="28" rx="5" fill="#6d8896"/><text x="420" y="517" fill="#536b63">-0.28</text><text x="420" y="539" fill="#536b63">지연 3</text>
    <rect x="505" y="399" width="70" height="67" rx="5" fill="#d2691e"/><text x="540" y="421" fill="#ffffff" font-weight="700">0.67</text><text x="540" y="488" fill="#9b4c16" font-weight="700">지연 4</text>
    <rect x="625" y="464" width="70" height="2" rx="1" fill="#176b8a"/><text x="660" y="493" fill="#536b63">0.02</text><text x="660" y="533" fill="#536b63">지연 5</text>
    <rect x="745" y="466" width="70" height="30" rx="5" fill="#6d8896"/><text x="780" y="519" fill="#536b63">-0.30</text><text x="780" y="539" fill="#536b63">지연 6</text>
  </g>
</svg>
