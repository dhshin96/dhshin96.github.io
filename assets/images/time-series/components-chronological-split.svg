<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">추세와 계절성이 있는 월별 시계열의 시간 순서 분할</title>
  <desc id="desc">2026년 1월부터 12월까지 장기 추세는 완만히 증가하고 관측값은 4개월 계절성 때문에 오르내린다. 1월부터 9월까지는 파란 훈련 구간, 10월부터 12월까지는 주황 테스트 구간으로 나뉜다.</desc>
  <rect width="960" height="520" rx="20" fill="#f8fbf9"/>
  <text x="40" y="48" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#183d32">시간 순서를 지킨 분할: 과거 9개월 → 미래 3개월</text>
  <text x="40" y="80" font-family="Arial, sans-serif" font-size="16" fill="#49665d">관측값 = 증가 추세 + 4개월 계절성</text>

  <rect x="70" y="112" width="615" height="300" rx="14" fill="#eaf4f8"/>
  <rect x="685" y="112" width="205" height="300" rx="14" fill="#fff1df"/>
  <line x1="70" y1="412" x2="890" y2="412" stroke="#91a79f" stroke-width="2"/>
  <line x1="70" y1="130" x2="70" y2="412" stroke="#91a79f" stroke-width="2"/>
  <line x1="685" y1="112" x2="685" y2="412" stroke="#d6802d" stroke-width="3" stroke-dasharray="8 7"/>

  <path d="M70 346 L144 336 L219 326 L293 316 L368 306 L443 296 L517 286 L592 276 L666 266 L741 256 L815 246 L890 236"
        fill="none" stroke="#7b8f88" stroke-width="3" stroke-dasharray="9 7"/>
  <path d="M70 346 L144 296 L219 246 L293 296 L368 266 L443 216 L517 166 L592 216 L666 186 L741 136 L815 86 L890 136"
        fill="none" stroke="#176b8a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <g fill="#176b8a">
    <circle cx="70" cy="346" r="6"/><circle cx="144" cy="296" r="6"/><circle cx="219" cy="246" r="6"/>
    <circle cx="293" cy="296" r="6"/><circle cx="368" cy="266" r="6"/><circle cx="443" cy="216" r="6"/>
    <circle cx="517" cy="166" r="6"/><circle cx="592" cy="216" r="6"/><circle cx="666" cy="186" r="6"/>
  </g>
  <g fill="#d2691e">
    <circle cx="741" cy="136" r="7"/><circle cx="815" cy="86" r="7"/><circle cx="890" cy="136" r="7"/>
  </g>

  <text x="90" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#176b8a">훈련: 1월~9월</text>
  <text x="708" y="390" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b85b17">테스트: 10월~12월</text>
  <text x="590" y="257" font-family="Arial, sans-serif" font-size="15" fill="#687d76">추세 Tₜ</text>
  <text x="456" y="149" font-family="Arial, sans-serif" font-size="15" fill="#176b8a">관측값 yₜ</text>

  <g font-family="Arial, sans-serif" font-size="13" fill="#536b63" text-anchor="middle">
    <text x="70" y="438">1</text><text x="144" y="438">2</text><text x="219" y="438">3</text>
    <text x="293" y="438">4</text><text x="368" y="438">5</text><text x="443" y="438">6</text>
    <text x="517" y="438">7</text><text x="592" y="438">8</text><text x="666" y="438">9</text>
    <text x="741" y="438">10</text><text x="815" y="438">11</text><text x="890" y="438">12월</text>
  </g>
  <rect x="70" y="466" width="18" height="18" rx="3" fill="#dceef5"/>
  <text x="98" y="480" font-family="Arial, sans-serif" font-size="15" fill="#36574c">과거 자료로 학습</text>
  <rect x="260" y="466" width="18" height="18" rx="3" fill="#ffe4c2"/>
  <text x="288" y="480" font-family="Arial, sans-serif" font-size="15" fill="#36574c">이후 자료로 평가</text>
</svg>
