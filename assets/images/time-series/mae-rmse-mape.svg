<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">MAE, RMSE, MAPE가 오차를 보는 방식</title>
  <desc id="desc">총절대오차가 28로 같은 고른 오차와 집중 오차를 막대로 비교한다. 고른 오차의 MAE는 4.67, RMSE는 4.73이고 집중 오차의 MAE는 4.67, RMSE는 11.43이다. 실제값 100, 10, 1에서 절대오차 1의 백분율 오차가 1퍼센트, 10퍼센트, 100퍼센트로 달라지는 모습도 보여 준다.</desc>
  <rect width="960" height="600" rx="20" fill="#f8fbf9"/>
  <text x="42" y="50" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#183d32">같은 총절대오차, 다른 평가</text>
  <text x="42" y="80" font-family="Arial, sans-serif" font-size="16" fill="#49665d">MAE는 총량을, RMSE는 큰 오차의 집중을, MAPE는 실제값 대비 비율을 본다</text>

  <rect x="42" y="110" width="876" height="250" rx="16" fill="#ffffff" stroke="#c9d9d3"/>
  <text x="70" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#294d42">총절대오차가 28인 두 경우</text>

  <g font-family="Arial, sans-serif" font-size="14" fill="#536b63" text-anchor="middle">
    <text x="318" y="177">1</text><text x="382" y="177">2</text><text x="446" y="177">3</text>
    <text x="510" y="177">4</text><text x="574" y="177">5</text><text x="638" y="177">6</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#36574c" text-anchor="end">
    <text x="265" y="224">고른 오차</text>
    <text x="265" y="293">집중 오차</text>
  </g>

  <g fill="#176b8a">
    <rect x="294" y="198" width="48" height="36" rx="6"/><rect x="358" y="198" width="48" height="36" rx="6"/>
    <rect x="422" y="206" width="48" height="28" rx="6"/><rect x="486" y="198" width="48" height="36" rx="6"/>
    <rect x="550" y="198" width="48" height="36" rx="6"/><rect x="614" y="198" width="48" height="36" rx="6"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="318" y="222">5</text><text x="382" y="222">5</text><text x="446" y="228">3</text>
    <text x="510" y="222">5</text><text x="574" y="222">5</text><text x="638" y="222">5</text>
  </g>
  <g fill="#d2691e">
    <rect x="294" y="267" width="48" height="8" rx="4"/><rect x="358" y="267" width="48" height="8" rx="4"/>
    <rect x="422" y="267" width="48" height="8" rx="4"/><rect x="486" y="267" width="48" height="8" rx="4"/>
    <rect x="550" y="267" width="48" height="8" rx="4"/><rect x="614" y="251" width="48" height="40" rx="6"/>
  </g>
  <text x="638" y="278" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">28</text>

  <g font-family="Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="700" y="190" width="180" height="54" rx="12" fill="#e5f1f5"/>
    <text x="790" y="213" fill="#176b8a" text-anchor="middle">MAE 4.67</text>
    <text x="790" y="234" fill="#176b8a" text-anchor="middle">RMSE 4.73</text>
    <rect x="700" y="258" width="180" height="54" rx="12" fill="#fff0e5"/>
    <text x="790" y="281" fill="#9b4c16" text-anchor="middle">MAE 4.67</text>
    <text x="790" y="302" fill="#9b4c16" text-anchor="middle">RMSE 11.43</text>
  </g>
  <text x="70" y="337" font-family="Arial, sans-serif" font-size="14" fill="#536b63">RMSE는 한 시점에 몰린 큰 오차를 더 강하게 드러낸다.</text>

  <rect x="42" y="382" width="876" height="174" rx="16" fill="#ffffff" stroke="#c9d9d3"/>
  <text x="70" y="417" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#294d42">절대오차가 모두 1이어도 MAPE는 달라진다</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="230" y="458" font-size="15" fill="#536b63">실제값 100</text>
    <text x="480" y="458" font-size="15" fill="#536b63">실제값 10</text>
    <text x="730" y="458" font-size="15" fill="#536b63">실제값 1</text>
    <rect x="155" y="476" width="150" height="45" rx="10" fill="#dce8e4"/>
    <rect x="405" y="476" width="150" height="45" rx="10" fill="#f4d9c7"/>
    <rect x="655" y="476" width="150" height="45" rx="10" fill="#d2691e"/>
    <text x="230" y="505" font-size="19" font-weight="700" fill="#294d42">1%</text>
    <text x="480" y="505" font-size="19" font-weight="700" fill="#8a4518">10%</text>
    <text x="730" y="505" font-size="19" font-weight="700" fill="#ffffff">100%</text>
  </g>
  <text x="480" y="545" font-family="Arial, sans-serif" font-size="14" fill="#536b63" text-anchor="middle">실제값이 작을수록 같은 절대오차의 비율이 커진다 · 평균 MAPE 37%</text>
</svg>
